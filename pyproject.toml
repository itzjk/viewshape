[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewshape"
version = "0.1.0"
description = "Compare resolved SQLite view columns between local snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["sqlite", "views", "schema-diff", "migrations", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Database"]

[project.urls]
Repository = "https://github.com/itzjk/viewshape"
Issues = "https://github.com/itzjk/viewshape/issues"

[project.scripts]
viewshape = "viewshape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
